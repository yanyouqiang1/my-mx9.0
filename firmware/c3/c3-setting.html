<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C3 键盘灯效 - 蓝牙调试端</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --border-color: #2a2a30;
            --text-color: #e1e1e6;
            --text-muted: #a1a1aa;
            --primary: #bb86fc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            text-align: center;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .status-panel {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff1744;
            margin-right: 6px;
        }

        .connected .status-indicator {
            background-color: #00e676;
            box-shadow: 0 0 8px #00e676;
        }

        .btn-connect {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-connect:active {
            transform: scale(0.98);
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .btn-led {
            padding: 20px 10px;
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-led:active {
            transform: scale(0.95);
        }

        .btn-red { background-color: #d50000; box-shadow: 0 4px 12px rgba(213,0,0,0.3); }
        .btn-blue { background-color: #2962ff; box-shadow: 0 4px 12px rgba(41,98,255,0.3); }
        .btn-green { background-color: #00c853; box-shadow: 0 4px 12px rgba(0,200,83,0.3); }
        .btn-yellow { background-color: #ffd600; color: #000; box-shadow: 0 4px 12px rgba(255,214,0,0.3); }
        .btn-stop {
            grid-column: span 2;
            background-color: #37474f;
            box-shadow: 0 4px 12px rgba(55,71,79,0.3);
        }

        .console-panel {
            margin-top: 20px;
            border: 1px solid var(--border-color);
            background-color: #0c0c0e;
            border-radius: 8px;
            padding: 10px;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            height: 120px;
            overflow-y: auto;
            color: #00e676;
        }

        .console-line {
            margin-bottom: 4px;
        }

        /* OTA Section */
        .ota-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .ota-section h3 {
            margin: 0 0 16px 0;
            font-size: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ota-status {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .ota-status.info {
            background: rgba(100, 181, 246, 0.1);
            border: 1px solid rgba(100, 181, 246, 0.3);
            color: #64b5f6;
        }

        .ota-status.success {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: #00e676;
        }

        .ota-status.error {
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid rgba(255, 23, 68, 0.3);
            color: #ff1744;
        }

        .ota-status.active {
            background: rgba(255, 214, 0, 0.1);
            border: 1px solid rgba(255, 214, 0, 0.3);
            color: #ffd600;
            display: block;
        }

        .ota-progress {
            margin-top: 8px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .ota-progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.2s;
        }

        .btn-ota {
            width: 100%;
            padding: 14px;
            background-color: #37474f;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }

        .btn-ota:hover {
            background-color: #455a64;
        }

        .btn-ota:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-ota.uploading {
            background-color: #ff6f00;
        }

        #ota-file {
            display: none;
        }

        .file-label {
            display: block;
            padding: 16px;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-label:hover {
            border-color: var(--primary);
        }

        .file-label.has-file {
            border-color: #00e676;
            border-style: solid;
        }

        .file-info {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ESP32-C3 蓝牙灯效测试</h2>

    <div class="status-panel" id="status-panel">
        <div>
            <span class="status-indicator"></span>
            <span id="status-text">蓝牙未连接</span>
        </div>
        <span style="font-size: 12px; color: var(--text-muted);" id="device-info">无设备</span>
    </div>

    <button id="btn-connect" class="btn-connect">连接键盘蓝牙 (C3_Keyboard_BLE)</button>

    <div class="control-grid">
        <button class="btn-led btn-red" onclick="sendCommand('R')">
            <span>R</span>
            <span style="font-size:12px; font-weight:normal;">红灯闪烁</span>
        </button>
        <button class="btn-led btn-blue" onclick="sendCommand('B')">
            <span>B</span>
            <span style="font-size:12px; font-weight:normal;">蓝灯闪烁</span>
        </button>
        <button class="btn-led btn-green" onclick="sendCommand('G')">
            <span>G</span>
            <span style="font-size:12px; font-weight:normal;">绿灯闪烁</span>
        </button>
        <button class="btn-led btn-yellow" onclick="sendCommand('Y')">
            <span>Y</span>
            <span style="font-size:12px; font-weight:normal;">黄灯闪烁</span>
        </button>
        <button class="btn-led btn-stop" onclick="sendCommand('S')">
            <span>S</span>
            <span style="font-size:12px; font-weight:normal;">停止蓝牙通知 (恢复之前灯效)</span>
        </button>
    </div>

    <!-- OTA Firmware Update Section -->
    <div class="ota-section">
        <h3>固件更新</h3>

        <div class="ota-status info" id="ota-status">
            选择 .bin 固件文件，通过蓝牙 OTA 升级 C3
        </div>

        <div class="ota-status success" id="ota-success">
            OTA 升级成功！设备将自动重启。
        </div>

        <div class="ota-status error" id="ota-error">
            OTA 升级失败: <span id="ota-error-msg"></span>
        </div>

        <div class="ota-status active" id="ota-progress">
            正在上传固件...
            <div class="ota-progress">
                <div class="ota-progress-bar" id="ota-progress-bar"></div>
            </div>
            <span id="ota-progress-text">0%</span>
        </div>

        <input type="file" id="ota-file" accept=".bin">
        <label for="ota-file" class="file-label" id="file-label">
            <div id="file-label-text">点击选择固件文件 (.bin)</div>
            <div class="file-info" id="file-info"></div>
        </label>

        <button id="btn-ota" class="btn-ota" onclick="startOTA()" disabled>
            开始 OTA 升级
        </button>
    </div>

    <div class="console-panel" id="console">
        <div class="console-line">> 调试控制台已就绪...</div>
    </div>
</div>

<script>
    // 与 ESP32-C3 固件对应的 UUID
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    // OTA Service UUID
    const OTA_SERVICE_UUID = "0000ffff-0000-1000-8000-00805f9b34fb";
    const OTA_CHAR_UUID = "0000ff01-0000-1000-8000-00805f9b34fb";

    let device = null;
    let characteristic = null;
    let otaCharacteristic = null;
    let selectedFile = null;

    const connectBtn = document.getElementById("btn-connect");
    const statusPanel = document.getElementById("status-panel");
    const statusText = document.getElementById("status-text");
    const deviceInfo = document.getElementById("device-info");
    const consoleBox = document.getElementById("console");

    const otaStatus = document.getElementById("ota-status");
    const otaSuccess = document.getElementById("ota-success");
    const otaError = document.getElementById("ota-error");
    const otaProgress = document.getElementById("ota-progress");
    const otaProgressBar = document.getElementById("ota-progress-bar");
    const otaProgressText = document.getElementById("ota-progress-text");
    const otaErrorMsg = document.getElementById("ota-error-msg");
    const fileLabel = document.getElementById("file-label");
    const fileLabelText = document.getElementById("file-label-text");
    const fileInfo = document.getElementById("file-info");
    const btnOta = document.getElementById("btn-ota");
    const otaFileInput = document.getElementById("ota-file");

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        const line = document.createElement("div");
        line.className = "console-line";
        line.innerText = `[${time}] ${msg}`;
        consoleBox.appendChild(line);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function hideAllOtaStatus() {
        otaStatus.style.display = 'none';
        otaSuccess.style.display = 'none';
        otaError.style.display = 'none';
        otaProgress.style.display = 'none';
    }

    function showOtaStatus(type, msg) {
        hideAllOtaStatus();
        if (type === 'info') {
            otaStatus.style.display = 'block';
            if (msg) otaStatus.innerHTML = msg;
        } else if (type === 'success') {
            otaSuccess.style.display = 'block';
        } else if (type === 'error') {
            otaError.style.display = 'block';
            otaErrorMsg.textContent = msg;
        } else if (type === 'progress') {
            otaProgress.style.display = 'block';
        }
    }

    connectBtn.addEventListener("click", async () => {
        if (device && device.gatt.connected) {
            log("正在主动断开连接...");
            device.gatt.disconnect();
            return;
        }

        log("开始检索键盘蓝牙设备...");
        try {
            device = await navigator.bluetooth.requestDevice({
                filters: [{ name: "C3_Keyboard_BLE" }],
                optionalServices: [SERVICE_UUID, OTA_SERVICE_UUID]
            });

            log(`已选择设备: ${device.name}`);
            deviceInfo.innerText = device.name;

            device.addEventListener('gattserverdisconnected', onDisconnected);

            log("正在连接 GATT 服务器...");
            const server = await device.gatt.connect();

            log("正在获取 UART 服务...");
            const service = await server.getPrimaryService(SERVICE_UUID);

            log("正在获取 RX 写入特征值...");
            characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // 获取 OTA 服务
            log("正在获取 OTA 服务...");
            const otaService = await server.getPrimaryService(OTA_SERVICE_UUID);
            otaCharacteristic = await otaService.getCharacteristic(OTA_CHAR_UUID);
            log("OTA 特征值获取成功");

            statusPanel.classList.add("connected");
            statusText.innerText = "已连接";
            connectBtn.innerText = "断开蓝牙连接";
            connectBtn.style.backgroundColor = "#ff1744";
            connectBtn.style.color = "#ffffff";
            log("连接成功！控制通道已就绪。");

            showOtaStatus('info', '已连接！选择固件文件开始 OTA 升级');

        } catch (error) {
            log(`连接过程出错: ${error}`);
            onDisconnected();
        }
    });

    function onDisconnected() {
        statusPanel.classList.remove("connected");
        statusText.innerText = "蓝牙未连接";
        connectBtn.innerText = "连接键盘蓝牙 (C3_Keyboard_BLE)";
        connectBtn.style.backgroundColor = "var(--primary)";
        connectBtn.style.color = "#000";
        deviceInfo.innerText = "无设备";
        characteristic = null;
        otaCharacteristic = null;
        log("设备已断开连接。");
        hideAllOtaStatus();
        showOtaStatus('info', '选择 .bin 固件文件，通过蓝牙 OTA 升级 C3');
    }

    async function sendCommand(cmdChar) {
        if (!characteristic) {
            log("发送失败：未连接到蓝牙特征值，请先建立连接！");
            return;
        }

        try {
            const encoder = new TextEncoder();
            const dataBytes = encoder.encode(cmdChar);

            if (typeof characteristic.writeValueWithResponse === "function") {
                await characteristic.writeValueWithResponse(dataBytes);
            } else if (typeof characteristic.writeValue === "function") {
                await characteristic.writeValue(dataBytes);
            }
            log(`特征值写入成功 => "${cmdChar}"`);
        } catch (error) {
            log(`指令发送异常: ${error}`);
        }
    }

    // 文件选择处理
    otaFileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (file) {
            if (!file.name.endsWith('.bin')) {
                log("错误：只支持 .bin 格式的固件文件");
                showOtaStatus('error', '只支持 .bin 格式的固件文件');
                return;
            }

            selectedFile = file;
            fileLabelText.textContent = file.name;
            fileInfo.textContent = `大小: ${(file.size / 1024).toFixed(1)} KB`;
            fileLabel.classList.add('has-file');
            btnOta.disabled = false;
            hideAllOtaStatus();
            showOtaStatus('info', `已选择: ${file.name} (${(file.size / 1024).toFixed(1)} KB)<br>点击"开始 OTA 升级"按钮进行升级`);
            log(`已选择固件文件: ${file.name} (${file.size} bytes)`);
        }
    });

    // OTA 升级
    async function startOTA() {
        if (!otaCharacteristic || !selectedFile) {
            log("OTA 失败：未连接或未选择固件文件");
            return;
        }

        hideAllOtaStatus();
        showOtaStatus('progress', '正在上传固件...');
        btnOta.classList.add('uploading');
        btnOta.disabled = true;
        log("开始 OTA 升级...");

        try {
            const fileBuffer = await selectedFile.arrayBuffer();
            const chunkSize = 512; // 每次写入512字节
            const totalChunks = Math.ceil(fileBuffer.byteLength / chunkSize);

            log(`固件大小: ${fileBuffer.byteLength} 字节，分 ${totalChunks} 包传输`);

            // 发送 OTA 开始命令
            const startCmd = new Uint8Array([0xF0]);
            await otaCharacteristic.writeValue(startCmd);
            log("已发送 OTA 开始命令");
            await new Promise(r => setTimeout(r, 100));

            // 分包发送固件
            for (let i = 0; i < totalChunks; i++) {
                const start = i * chunkSize;
                const end = Math.min(start + chunkSize, fileBuffer.byteLength);
                const chunk = new Uint8Array(fileBuffer.slice(start, end));

                await otaCharacteristic.writeValue(chunk);

                const progress = Math.round((i + 1) / totalChunks * 100);
                otaProgressBar.style.width = progress + '%';
                otaProgressText.textContent = progress + '%';

                // 每10包输出一次日志
                if (i % 10 === 0 || i === totalChunks - 1) {
                    log(`上传进度: ${i + 1}/${totalChunks} (${progress}%)`);
                }

                // 添加小延迟避免蓝牙阻塞
                await new Promise(r => setTimeout(r, 10));
            }

            // 发送 OTA 结束命令
            const endCmd = new Uint8Array([0xF1]);
            await otaCharacteristic.writeValue(endCmd);
            log("已发送 OTA 结束命令");

            hideAllOtaStatus();
            showOtaStatus('success');
            log("OTA 升级成功！设备将自动重启。");

        } catch (error) {
            log(`OTA 升级失败: ${error}`);
            hideAllOtaStatus();
            showOtaStatus('error', error.message || String(error));
            btnOta.classList.remove('uploading');
            btnOta.disabled = false;
        }
    }
</script>
</body>
</html>
