; C3 Firmware - ESP32-C3 LED Controller + Bluetooth OTA
; Board: ESP32-C3 with 4MB Flash

[env:esp32-c3-devkitc-1]
platform = espressif32
board = esp32-c3-devkitc-1
framework = arduino
monitor_speed = 115200

; 分区表：支持 OTA (4MB Flash)
board_build.partitions = src/partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
    -DBUILD_FIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
