; E3 Firmware - ESP32 Bluetooth Audio Gateway + WiFi OTA
; Hardware: ESP32-D0WD (4MB Flash, 320KB RAM)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; 分区表: 适配 4MB Flash
board_build.partitions = src/partitions_4mb.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
    -DBUILD_FIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
