; E3 Firmware - ESP32-S3 Bluetooth Audio Gateway + WiFi-OTA
; Board: S3W Room E3 (ESP32-S3 based with 16MB Flash, 8MB PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 分区表：支持双 OTA 分区 + SPIFFS (16MB Flash)
board_build.partitions = src/partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
    -DBUILD_FIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.4
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SHT31 Library@^1.4.5
