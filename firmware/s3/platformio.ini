; S3 Firmware - ESP32-S3 USB Sound Card + I2S Audio + WiFi-OTA
; Board: N16R8 (ESP32-S3 DevKitC-1 with 16MB Flash, 8MB PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 分区表：支持双 OTA 分区 (N16R8 = 16MB Flash)
board_build.partitions = src/partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
    -DBUILD_FIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.4
    bblanchon/ArduinoJson@^6.21.3
