; S3 蓝牙音频网关测试版本
; 无需 MCP23017 矩阵键盘，纯测试蓝牙音频功能

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

# USB 外设：复合设备 (USB Audio + CDC)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DUSE_TINYUSB
    -DCFG_TUD_AUDIO=1
    -DCFG_TUD_AUDIO_HEADSET=1
    -DCONFIG_BTDM_CONTROLLER_MODE_BTDM=1
    -DCONFIG_BT_CONTROLLER_ENABLED=1
    -DCONFIG_A2DP_ENABLE=1
    -DCONFIG_A2DP_SINK_ENABLE=1
    -Icomponents/ring_buffer
    -Icomponents/usb_audio
    -Icomponents/bt_audio
    -Icomponents/audio_output

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
