<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YYQ-MX9.0 极客控制台 Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1050px; margin: auto; padding: 20px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 22px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        h2 { border-left: 5px solid #38bdf8; padding-left: 10px; font-size: 1.25rem; margin-top: 0; color: #f1f5f9; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-green { background: #10b981; } .btn-green:hover { background: #059669; }
        .btn-orange { background: #f59e0b; } .btn-orange:hover { background: #d97706; }
        .btn-tag { background: #475569; padding: 6px 10px; font-size: 0.85rem; margin: 3px; border-radius: 4px; color: white; border: none; cursor: pointer; }
        select, input, textarea { padding: 9px; margin: 6px 0; border: 1px solid #475569; border-radius: 6px; width: 100%; box-sizing: border-box; background: #0f172a; color: white; }
        .item-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: #334155; padding: 10px; border-radius: 6px; }
        .remove-btn { color: #f87171; cursor: pointer; font-weight: bold; margin-left: auto; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .hint { font-size: 0.85rem; color: #94a3b8; }
        .chk-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0; }
        .chk-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 0.9rem; }
        .chk-group input[type="checkbox"] { width: auto; margin: 0; }
        .mode-tabs { display: flex; gap: 15px; margin: 8px 0; }
        .mode-tabs label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: bold; }
        .mode-tabs input[type="radio"] { width: auto; margin: 0; }
    </style>
</head>
<body>

    <h1>⌨️ YYQ-MX9.0 极客主控配置台 Pro</h1>

    <!-- 1. 连接与时间同步 -->
    <div class="card">
        <h2>1. 蓝牙连接与精准时间同步</h2>
        <div style="display: flex; gap: 15px; align-items: center;">
            <button class="btn" id="connectBtn">连接键盘蓝牙</button>
            <span id="status" style="font-weight: bold; color: #f87171;">未连接</span>
            <button class="btn btn-green" id="syncTimeBtn" style="margin-left: auto;">同步当前电脑时间 (自动校准本地时区)</button>
        </div>
    </div>

    <!-- 2. MA、MB 全局专用键设置 -->
    <div class="card">
        <h2>2. 全局独立功能键 (MA / MB) - 支持切换方案与组合键并行</h2>
        <div class="hint">MA、MB 在所有配置方案下通用生效；支持只切换方案、只触发组合键、或方案切换+组合键联动执行。</div>
        <div class="grid-2" style="margin-top: 10px;">
            <!-- MA 配置 -->
            <div style="background: #334155; padding: 15px; border-radius: 8px;">
                <h3 style="margin-top:0; color:#38bdf8;">MA 功能分配</h3>
                <label>① 切换配置方案：</label>
                <select id="maSwAction">
                    <option value="NONE">不切换方案 (无动作)</option>
                    <option value="0" selected>切换到：方案 1 (Windows 默认)</option>
                    <option value="1">切换到：方案 2 (macOS 默认)</option>
                    <option value="2">切换到：方案 3 (游戏定制)</option>
                    <option value="3">切换到：方案 4 (工作定制)</option>
                    <option value="NEXT">循环切换到下一个方案</option>
                </select>

                <label style="margin-top: 6px; display:block;">② 附加组合键 (可选同时触发)：</label>
                <div class="chk-group">
                    <label><input type="checkbox" id="maCtrl"> Ctrl</label>
                    <label><input type="checkbox" id="maAlt"> Alt</label>
                    <label><input type="checkbox" id="maShift"> Shift</label>
                    <label><input type="checkbox" id="maWin"> Win/Cmd</label>
                </div>
                <div style="display: flex; gap: 8px;">
                    <select id="maKeySelect" style="flex: 2;"></select>
                    <input type="text" id="maCustomChar" maxlength="1" placeholder="或单字符" style="flex: 1;" title="如填入T则优先组合T">
                </div>
                <button class="btn btn-green" id="saveMaBtn" style="width: 100%; margin-top: 10px;">保存 MA 全局设置</button>
            </div>

            <!-- MB 配置 -->
            <div style="background: #334155; padding: 15px; border-radius: 8px;">
                <h3 style="margin-top:0; color:#38bdf8;">MB 功能分配</h3>
                <label>① 切换配置方案：</label>
                <select id="mbSwAction">
                    <option value="NONE">不切换方案 (无动作)</option>
                    <option value="1" selected>切换到：方案 2 (macOS 默认)</option>
                    <option value="0">切换到：方案 1 (Windows 默认)</option>
                    <option value="2">切换到：方案 3 (游戏定制)</option>
                    <option value="3">切换到：方案 4 (工作定制)</option>
                    <option value="NEXT">循环切换到下一个方案</option>
                </select>

                <label style="margin-top: 6px; display:block;">② 附加组合键 (可选同时触发)：</label>
                <div class="chk-group">
                    <label><input type="checkbox" id="mbCtrl"> Ctrl</label>
                    <label><input type="checkbox" id="mbAlt"> Alt</label>
                    <label><input type="checkbox" id="mbShift"> Shift</label>
                    <label><input type="checkbox" id="mbWin"> Win/Cmd</label>
                </div>
                <div style="display: flex; gap: 8px;">
                    <select id="mbKeySelect" style="flex: 2;"></select>
                    <input type="text" id="mbCustomChar" maxlength="1" placeholder="或单字符" style="flex: 1;" title="如填入T则优先组合T">
                </div>
                <button class="btn btn-green" id="saveMbBtn" style="width: 100%; margin-top: 10px;">保存 MB 全局设置</button>
            </div>
        </div>
    </div>

    <!-- 3. 配置方案详情：普通按键重映射 Diff + M1-M12 宏 -->
    <div class="card">
        <h2>3. 方案专属配置 (按键重映射变更 + M1~M12 专属宏)</h2>
        <div>
            <label style="font-weight: bold; font-size: 1.1rem; color: #38bdf8;">当前编辑的目标方案 (Profile):</label>
            <select id="activeProfile">
                <option value="0">方案 1 (Windows 默认基底)</option>
                <option value="1">方案 2 (macOS 默认基底)</option>
                <option value="2">方案 3 (游戏定制)</option>
                <option value="3">方案 4 (工作定制)</option>
            </select>
        </div>

        <div class="grid-2" style="margin-top: 15px;">
            <!-- 按键映射修改 -->
            <div style="border-right: 1px solid #334155; padding-right: 15px;">
                <h3>按键重映射变更 (比如 Win 与 Ctrl 互换)</h3>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <select id="remapFrom"></select>
                    <span>➔</span>
                    <select id="remapTo"></select>
                </div>
                <button class="btn-tag" id="addRemapBtn" style="width: 100%; margin-top: 5px;">+ 加入修改列表</button>
                <div id="remapList" style="margin-top: 10px;"></div>
                <button class="btn btn-green" id="saveRemapBtn" style="width: 100%; margin-top: 10px;">保存按键变更到此方案</button>
            </div>

            <!-- M1~M12 方案宏 -->
            <div>
                <h3>方案专属宏 (M1 ~ M12)</h3>
                <label>目标宏按键:</label>
                <select id="macroKey">
                    <option value="M1">M1</option><option value="M2">M2</option><option value="M3">M3</option>
                    <option value="M4">M4</option><option value="M5">M5</option><option value="M6">M6</option>
                    <option value="M7">M7</option><option value="M8">M8</option><option value="M9">M9</option>
                    <option value="M10">M10</option><option value="M11">M11</option><option value="M12">M12</option>
                </select>

                <!-- 模式切换：打字效果 vs 组合键效果 -->
                <div class="mode-tabs">
                    <label><input type="radio" name="macroMode" value="SEQ" checked onchange="toggleMacroMode()"> 🔤 打字效果 (连续文本)</label>
                    <label><input type="radio" name="macroMode" value="CMB" onchange="toggleMacroMode()"> ⚡ 组合快捷键 (同时按下)</label>
                </div>

                <!-- 打字模式面板 -->
                <div id="seqPanel">
                    <div style="margin-top: 5px;">
                        <button class="btn-tag" onclick="insertTag('[ENTER]')">回车 [ENTER]</button>
                        <button class="btn-tag" onclick="insertTag('[TAB]')">Tab [TAB]</button>
                        <button class="btn-tag" onclick="insertTag('[ESC]')">Esc [ESC]</button>
                        <button class="btn-tag" onclick="insertTag('[BACKSPACE]')">退格 [BACKSPACE]</button>
                    </div>
                    <textarea id="seqInput" rows="3" placeholder="例如: git pull && npm run dev[ENTER]"></textarea>
                </div>

                <!-- 组合键模式面板 -->
                <div id="cmbPanel" style="display: none; background: #334155; padding: 12px; border-radius: 6px; margin: 6px 0;">
                    <div class="hint">勾选修饰键并选择/输入按键，生成同时按下的组合效果（如 Ctrl+Shift+Esc）：</div>
                    <div class="chk-group" style="margin-top: 8px;">
                        <label><input type="checkbox" id="macroCtrl"> Ctrl</label>
                        <label><input type="checkbox" id="macroAlt"> Alt</label>
                        <label><input type="checkbox" id="macroShift"> Shift</label>
                        <label><input type="checkbox" id="macroWin"> Win/Cmd</label>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 6px;">
                        <select id="macroKeySelect" style="flex: 2;"></select>
                        <input type="text" id="macroCustomChar" maxlength="1" placeholder="或单字符" style="flex: 1;" title="如填入字母或数字">
                    </div>
                </div>

                <button class="btn btn-green" id="saveMacroBtn" style="width: 100%; margin-top: 8px;">保存此宏到当前方案</button>
            </div>
        </div>
    </div>

    <!-- 4. 跑马灯标语 -->
    <div class="card">
        <h2>4. 屏幕跑马灯标语</h2>
        <input type="text" id="marqueeText" placeholder="在此输入需要滚动的句子..." value="YYQ Studio - 极客机械大师">
        <button class="btn btn-orange" id="sendMarqueeBtn">更新到屏幕跑马灯</button>
    </div>

<script>
    // 键盘标准 KeyCode 码表字典
    const KEY_OPTIONS = {
        "无按键": 0,
        "A": 97, "B": 98, "C": 99, "D": 100, "E": 101, "F": 102, "G": 103,
        "H": 104, "I": 105, "J": 106, "K": 107, "L": 108, "M": 109, "N": 110,
        "O": 111, "P": 112, "Q": 113, "R": 114, "S": 115, "T": 116, "U": 117,
        "V": 118, "W": 119, "X": 120, "Y": 121, "Z": 122,
        "0": 48, "1": 49, "2": 50, "3": 51, "4": 52, "5": 53, "6": 54, "7": 55, "8": 56, "9": 57,
        "F1": 194, "F2": 195, "F3": 196, "F4": 197, "F5": 198, "F6": 199,
        "F7": 200, "F8": 201, "F9": 202, "F10": 203, "F11": 204, "F12": 205,
        "Enter 回车": 176, "Esc": 177, "Backspace 退格": 178, "Tab": 179, "Space 空格": 32,
        "Delete": 212, "Home": 210, "End": 213, "Page Up": 211, "Page Down": 214,
        "↑ 上箭头": 218, "↓ 下箭头": 217, "← 左箭头": 216, "→ 右箭头": 215,
        "Left Ctrl": 128, "Left Shift": 129, "Left Alt": 130, "Left Win": 131
    };

    function populateSelects() {
        let fromSel = document.getElementById('remapFrom');
        let toSel = document.getElementById('remapTo');
        let maKeySel = document.getElementById('maKeySelect');
        let mbKeySel = document.getElementById('mbKeySelect');
        let macroKeySel = document.getElementById('macroKeySelect');

        for (let name in KEY_OPTIONS) {
            let val = KEY_OPTIONS[name];
            let opt = `<option value="${val}">${name}</option>`;
            if (val !== 0) {
                fromSel.innerHTML += opt;
                toSel.innerHTML += opt;
            }
            maKeySel.innerHTML += opt;
            mbKeySel.innerHTML += opt;
            macroKeySel.innerHTML += opt;
        }
    }
    populateSelects();

    function toggleMacroMode() {
        let mode = document.querySelector('input[name="macroMode"]:checked').value;
        document.getElementById('seqPanel').style.display = (mode === 'SEQ') ? 'block' : 'none';
        document.getElementById('cmbPanel').style.display = (mode === 'CMB') ? 'block' : 'none';
    }

    // 辅助：从界面修饰键复选框与按键选择框提取组合键码数组
    function buildComboCodes(ctrlId, altId, shiftId, winId, selectId, customCharId) {
        let codes = [];
        if (document.getElementById(ctrlId).checked) codes.push(128);  // Left Ctrl
        if (document.getElementById(altId).checked) codes.push(130);   // Left Alt
        if (document.getElementById(shiftId).checked) codes.push(129); // Left Shift
        if (document.getElementById(winId).checked) codes.push(131);   // Left Win/Cmd

        let customChar = document.getElementById(customCharId).value.trim();
        if (customChar.length > 0) {
            codes.push(customChar.toLowerCase().charCodeAt(0));
        } else {
            let keyVal = parseInt(document.getElementById(selectId).value);
            if (keyVal > 0) codes.push(keyVal);
        }
        return codes;
    }

    let myCharacteristic;
    let remapRules = [];

    document.getElementById('connectBtn').addEventListener('click', async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ["4fafc201-1fb5-459e-8fcc-c5c9c331914b"]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService("4fafc201-1fb5-459e-8fcc-c5c9c331914b");
            myCharacteristic = await service.getCharacteristic("beb5483e-36e1-4688-b7f5-ea07361b26a8");
            document.getElementById('status').innerText = "已连接 ✅";
            document.getElementById('status').style.color = "#4ade80";
        } catch(e) {
            alert("连接失败: " + e.message);
        }
    });

    async function sendBLE(str) {
        if (!myCharacteristic) { alert("请先连接蓝牙！"); return; }
        const encoder = new TextEncoder();
        await myCharacteristic.writeValue(encoder.encode(str));
        await new Promise(r => setTimeout(r, 60));
    }

    // 1. 同步时间
    document.getElementById('syncTimeBtn').addEventListener('click', async () => {
        const sec = Math.floor(Date.now() / 1000);
        await sendBLE("TIME:" + sec);
        alert("已将当前电脑时间下发给键盘！");
    });

    // 2. MA / MB 全局键配置 (支持方案切换与组合键并行)
    document.getElementById('saveMaBtn').addEventListener('click', async () => {
        let sw = document.getElementById('maSwAction').value;
        let cmbCodes = buildComboCodes('maCtrl', 'maAlt', 'maShift', 'maWin', 'maKeySelect', 'maCustomChar');
        
        let payload = "";
        if (sw !== "NONE") {
            payload = "SW:" + sw;
            if (cmbCodes.length > 0) payload += "+CMB:" + cmbCodes.join(',');
        } else {
            if (cmbCodes.length > 0) payload = "CMB:" + cmbCodes.join(',');
            else payload = "NONE";
        }

        await sendBLE(`GSET:MA:${payload}`);
        alert("MA 全局设置已生效！");
    });

    document.getElementById('saveMbBtn').addEventListener('click', async () => {
        let sw = document.getElementById('mbSwAction').value;
        let cmbCodes = buildComboCodes('mbCtrl', 'mbAlt', 'mbShift', 'mbWin', 'mbKeySelect', 'mbCustomChar');
        
        let payload = "";
        if (sw !== "NONE") {
            payload = "SW:" + sw;
            if (cmbCodes.length > 0) payload += "+CMB:" + cmbCodes.join(',');
        } else {
            if (cmbCodes.length > 0) payload = "CMB:" + cmbCodes.join(',');
            else payload = "NONE";
        }

        await sendBLE(`GSET:MB:${payload}`);
        alert("MB 全局设置已生效！");
    });

    // 3. 按键重映射
    document.getElementById('addRemapBtn').addEventListener('click', () => {
        let fromSel = document.getElementById('remapFrom');
        let toSel = document.getElementById('remapTo');
        remapRules.push({
            fVal: fromSel.value, tVal: toSel.value,
            fName: fromSel.options[fromSel.selectedIndex].text,
            tName: toSel.options[toSel.selectedIndex].text
        });
        renderRemapList();
    });

    function renderRemapList() {
        let box = document.getElementById('remapList');
        box.innerHTML = "";
        remapRules.forEach((r, idx) => {
            box.innerHTML += `
                <div class="item-row">
                    <span>${r.fName} ➔ <b>${r.tName}</b></span>
                    <span class="remove-btn" onclick="remapRules.splice(${idx},1); renderRemapList();">✕</span>
                </div>
            `;
        });
    }

    document.getElementById('saveRemapBtn').addEventListener('click', async () => {
        let prof = document.getElementById('activeProfile').value;
        if (remapRules.length === 0) {
            await sendBLE(`REMAP:${prof}:1:`);
            alert("已清空此方案的所有按键修改，恢复标准键位！");
            return;
        }
        let pairs = remapRules.map(r => `${r.fVal},${r.tVal}`).join(';');
        await sendBLE(`REMAP:${prof}:1:${pairs}`);
        alert(`已将 ${remapRules.length} 条按键修改保存到方案 ${Number(prof)+1}！`);
    });

    // 4. M1~M12 宏配置 (打字流与组合键模式)
    document.getElementById('saveMacroBtn').addEventListener('click', async () => {
        let prof = document.getElementById('activeProfile').value;
        let mKey = document.getElementById('macroKey').value;
        let mode = document.querySelector('input[name="macroMode"]:checked').value;

        if (mode === "SEQ") {
            let txt = document.getElementById('seqInput').value;
            if (!txt) return alert("请输入宏击键流内容！");
            await sendBLE(`SET:p${prof}_${mKey}:SEQ:${txt}`);
            alert(`已保存打字宏到方案 ${Number(prof)+1} 的 ${mKey}！`);
        } else {
            let codes = buildComboCodes('macroCtrl', 'macroAlt', 'macroShift', 'macroWin', 'macroKeySelect', 'macroCustomChar');
            if (codes.length === 0) return alert("请至少选择或输入一个组合键！");
            await sendBLE(`SET:p${prof}_${mKey}:CMB:${codes.join(',')}`);
            alert(`已保存组合键宏到方案 ${Number(prof)+1} 的 ${mKey}！`);
        }
    });

    // 5. 跑马灯
    document.getElementById('sendMarqueeBtn').addEventListener('click', async () => {
        let txt = document.getElementById('marqueeText').value;
        await sendBLE(`MARQUEE:${txt}`);
        alert("跑马灯已更新！");
    });

    function insertTag(tag) {
        const textarea = document.getElementById('seqInput');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + tag + textarea.value.substring(end);
        textarea.focus();
    }
</script>
</body>
</html>
