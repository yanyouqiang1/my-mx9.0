[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ⚠ 不装 lvgl / ST7789 / MCP23017 / JPEGDEC / ArduinoJson：
;   这个工程只用来把**蓝牙链路层**单独拎出来测，跑得快、内存干净，
;   崩了也一定是链路层的事，不会是界面/传感器的事。
;
; USB 走 ARDUINO_USB_MODE=1（USB-Serial-JTAG 硬件 CDC）：
;   日志直接走 /dev/cu.usbmodem* ，不用外接 USB-TTL。
;   这里不做 HID，所以不存在"HID 抢走 USB 导致读不到日志"的问题。

build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_PSRAM_NOW
    "-I${PROJECT_DIR}/src"

board_build.arduino.memory_type = qio_opi

upload_speed = 921600
monitor_filters = esp32_exception_decoder
