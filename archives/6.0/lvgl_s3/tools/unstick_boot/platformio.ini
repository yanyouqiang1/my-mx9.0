; unstick —— "把卡在 ROM 下载模式的板子救出来"用的一次性固件。
;
; 刷到 app1 (0x340000)，同时把 otadata 指到 app1；
; 它跑起来之后会把 GPIO0 拉高、把启动分区改回 app0，然后复位 ——
; 于是 ROM 采样到 BOOT=高，正常启动 app0 里的真固件。
;
; ⚠ 分区表必须和产品一致（app0@0x10000 / app1@0x340000 / otadata@0xe000），
;   否则 app1 的偏移就错了，芯片会启动不了。
[env:unstick]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_PSRAM_NOW

board_build.arduino.memory_type = qio_opi
upload_speed = 921600
