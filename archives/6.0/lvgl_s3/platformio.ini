[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    C:/Users/37458/Documents/Arduino/libraries/lvgl
    C:/Users/37458/Documents/Arduino/libraries/Adafruit_ST7735_and_ST7789_Library
    C:/Users/37458/Documents/Arduino/libraries/Adafruit_MCP23017_Arduino_Library
    C:/Users/37458/Documents/Arduino/libraries/Adafruit_GFX_Library
    C:/Users/37458/Documents/Arduino/libraries/Adafruit_BusIO
    C:/Users/37458/Documents/Arduino/libraries/JPEGDEC

build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_PATH="E:/ai-project/mx9.0/archives/6.0/lvgl_s3/src/lv_conf.h"
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_PSRAM_NOW
    "-IC:/Users/37458/Documents/Arduino/libraries/Adafruit_GFX_Library"
    "-IC:/Users/37458/Documents/Arduino/libraries/Adafruit_ST7735_and_ST7789_Library"
    "-IC:/Users/37458/Documents/Arduino/libraries/Adafruit_MCP23017_Arduino_Library/src"
    "-IC:/Users/37458/Documents/Arduino/libraries/Adafruit_BusIO"
    "-IC:/Users/37458/Documents/Arduino/libraries/ArduinoJson/src"
    "-IC:/Users/37458/Documents/Arduino/libraries/JPEGDEC/src"
    "-IE:/ai-project/mx9.0/archives/6.0/lvgl_s3/src"

# 板子是 ESP32-S3-N16R8 = 16MB Quad Flash + 8MB 八线(OPI) PSRAM。
# PlatformIO 里 esp32-s3-devkitc-1 的板定义是 "N8 (8 MB QD, No PSRAM)"，
# 没有这一行的话 sdkconfig 根本不初始化 PSRAM，8MB 一直闲置，
# LVGL 对象池 / 帧缓冲 / BLE / FFat 全挤在 327KB 内部 DRAM 上。
# 分区表保持 8MB 不动 —— 改了会重分区，NVS 和 FFat 里的宏/按键重映射会被抹掉。
board_build.arduino.memory_type = qio_opi

upload_speed = 921600
monitor_filters = esp32_exception_decoder

