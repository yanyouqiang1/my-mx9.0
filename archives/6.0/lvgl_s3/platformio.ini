[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    lvgl@^8.4.0
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit MCP23017 Arduino Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    bitbank2/JPEGDEC
    bblanchon/ArduinoJson

build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_PATH="${PROJECT_DIR}/src/lv_conf.h"
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_PSRAM_NOW
    "-I${PROJECT_DIR}/src"

# 板子是 ESP32-S3-N16R8 = 16MB Quad Flash + 8MB 八线(OPI) PSRAM。
# PlatformIO 里 esp32-s3-devkitc-1 的板定义是 "N8 (8 MB QD, No PSRAM)"，
# 没有这一行的话 sdkconfig 根本不初始化 PSRAM，8MB 一直闲置，
# LVGL 对象池 / 帧缓冲 / BLE / SPIFFS 全挤在 327KB 内部 DRAM 上。
#
# 分区表**不要动**：板定义给的是 default_8MB.csv，
#   0x9000 nvs / 0xe000 otadata / 0x10000 app0 / 0x340000 app1 /
#   0x670000 spiffs(1.5MB) / 0x7F0000 coredump
# 固件里的宏、按键重映射、方案、灯光、校准值全在 nvs 分区（NVS），
# 壁纸 /logo.bin 和 ME 文本 /me_hex.txt 在 spiffs 分区。
# 换分区表会挪动这些分区的偏移，等于把用户配置全抹掉。
#
# 注意这里**没有** ffat 分区：固件必须用 SPIFFS，不能用 FFat
# （FFat.begin() 会去找 subtype=fat 的分区，找不到就直接失败，
#  表现是 ME 文本"存入失败"、壁纸一重启就丢）。详见 src/lvgl_s3.ino 的 setup()。
# 真要换成 FAT，得自己写一份 csv 把 spiffs 那行改成 `ffat, data, fat, ...`
# 并设 board_build.partitions，那样 spiffs 里的壁纸会被清掉。
board_build.arduino.memory_type = qio_opi

upload_speed = 921600
monitor_filters = esp32_exception_decoder

[env:esp32-s3-devkitc-1_debug]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    lvgl@^8.4.0
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit MCP23017 Arduino Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    bitbank2/JPEGDEC
    bblanchon/ArduinoJson

build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_PATH="${PROJECT_DIR}/src/lv_conf.h"
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_PSRAM_NOW
    "-I${PROJECT_DIR}/src"

board_build.arduino.memory_type = qio_opi

upload_speed = 921600
monitor_filters = esp32_exception_decoder
