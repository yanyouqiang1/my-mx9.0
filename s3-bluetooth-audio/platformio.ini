[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

# USB 外设：复合设备 (键盘 + USB Audio + CDC + MIDI)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DUSE_TINNYUSB
    -DCFG_TUD_AUDIO=1
    -DESP32S3_NOCDN
    # 启用 Classic BT + BLE 双模蓝牙
    -DCONFIG_BTDM_CONTROLLER_MODE_BTDM=1
    -DCONFIG_BT_CONTROLLER_ENABLED=1
    -DCONFIG_A2DP_ENABLE=1
    -DCONFIG_A2DP_SINK_ENABLE=1
    # 组件路径
    -Icomponents/ring_buffer
    -Icomponents/usb_audio
    -Icomponents/bt_audio
    -Icomponents/audio_output
    # 音频缓冲区
    -DCFG_TUD_AUDIO_HEADSET=1

# 额外库依赖
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.3
    h2zero/NimBLE-Arduino@^1.4.1
